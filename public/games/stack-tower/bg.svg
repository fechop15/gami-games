<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="45%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4c1d95" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#skyGrad)"/>
  <circle cx="820" cy="260" r="360" fill="url(#glow1)"/>
  <circle cx="180" cy="1500" r="420" fill="url(#glow1)"/>
  <!-- distant city silhouette -->
  <g opacity="0.25" fill="#2e1065">
    <rect x="60" y="1550" width="120" height="260" rx="18"/>
    <rect x="200" y="1470" width="140" height="340" rx="18"/>
    <rect x="360" y="1600" width="100" height="210" rx="18"/>
    <rect x="620" y="1500" width="130" height="310" rx="18"/>
    <rect x="770" y="1600" width="110" height="210" rx="18"/>
    <rect x="900" y="1450" width="140" height="360" rx="18"/>
  </g>
  <!-- decorative floating blocks -->
  <g opacity="0.3">
    <rect x="120" y="300" width="150" height="90" rx="24" fill="url(#towerGrad)"/>
    <rect x="760" y="620" width="170" height="100" rx="26" fill="url(#towerGrad)"/>
    <rect x="80" y="900" width="130" height="80" rx="20" fill="url(#towerGrad)"/>
    <rect x="850" y="1050" width="150" height="90" rx="24" fill="url(#towerGrad)"/>
    <rect x="450" y="200" width="140" height="85" rx="22" fill="url(#towerGrad)"/>
  </g>
  <!-- soft blobs -->
  <circle cx="950" cy="1750" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="90" cy="200" r="100" fill="#ffffff" opacity="0.08"/>
  <circle cx="540" cy="960" r="260" fill="#ffffff" opacity="0.04"/>
</svg>
