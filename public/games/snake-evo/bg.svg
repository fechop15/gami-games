    <line x1="0" y1="1400" x2="1080" y2="1400"/>
    <line x1="0" y1="1500" x2="1080" y2="1500"/>
    <line x1="0" y1="1620" x2="1080" y2="1620"/>
    <line x1="0" y1="1760" x2="1080" y2="1760"/>
    <line x1="0" y1="1920" x2="1080" y2="1920"/>
    <line x1="140" y1="1400" x2="0" y2="1920"/>
    <line x1="340" y1="1400" x2="220" y2="1920"/>
    <line x1="540" y1="1400" x2="540" y2="1920"/>
    <line x1="740" y1="1400" x2="860" y2="1920"/>
    <line x1="940" y1="1400" x2="1080" y2="1920"/>
  </g>
  <g opacity="0.16" fill="none" stroke="#22d3ee" stroke-width="6">
